
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Bundle the offline label reader
        run: |
          mkdir -p www/tess/core www/tess/lang
          cp node_modules/tesseract.js/dist/tesseract.min.js www/tess/
          cp node_modules/tesseract.js/dist/worker.min.js www/tess/
          cp node_modules/tesseract.js-core/tesseract-core* www/tess/core/
          cp node_modules/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz www/tess/lang/
          ls -R www/tess

      - name: Create Android project
        run: npx cap add android
        
      - name: Add Maven Central mirror
        run: |
          sed -i "s#mavenCentral()#maven { url 'https://repo1.maven.org/maven2/' }; mavenCentral()#g" android/build.gradle
          cat android/build.gradle

      - name: Allow camera
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: App icon
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Copy web files into the app
        run: npx cap sync android

      - name: Verify OCR files in Android
        run: |
          ls -l android/app/src/main/assets/public/tess/lang/

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bili-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
